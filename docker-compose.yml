version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cmport_db
    restart: always
    environment:
      MYSQL_DATABASE: cmport_gerenciamento
      MYSQL_ROOT_PASSWORD: cmport2026
      MYSQL_USER: cmport
      MYSQL_PASSWORD: cmport123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"  # Você acessará por http://localhost:8080
    depends_on:
      - db           # Garante que o Adminer só suba após o banco estar pronto

  minio:
    image: minio/minio:latest
    container_name: cmport_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3-compatível
      - "9001:9001"   # Console web (http://localhost:9001)
    volumes:
      - minio_data:/data

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cmport_mediamtx
    environment:
      # backend roda no host via uvicorn (nao no docker-compose) em dev —
      # host.docker.internal alcança o host a partir de dentro do container
      MTX_AUTHHTTPADDRESS: http://host.docker.internal:8000/api/v1/mediamtx/auth
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"     # RTMP push (camera de teste aponta pra cá)
      - "127.0.0.1:8889:8889"  # WebRTC/WHEP — só o backend local acessa (não abrir na rede)
      - "8189:8189/udp" # WebRTC ICE
      - "127.0.0.1:9997:9997"  # API (só em dev, pra debugar - nao mapear em producao)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  minio_data:
