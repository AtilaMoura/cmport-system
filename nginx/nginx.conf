# HTTP (80): só o desafio do Let's Encrypt; todo o resto vai pro HTTPS no domínio.
# Acesso antigo pelo IP (http://168.231.96.184) também cai no domínio — o
# certificado só vale para dash.cmport.com.br.
server {
    listen 80;
    server_name _;

    # Desafio HTTP-01 do Let's Encrypt (emissão e renovação do certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dash.cmport.com.br$request_uri;
    }
}

# HTTPS (443) por qualquer outro nome (ex.: https://168.231.96.184) — manda pro
# domínio. Sem isso o site abria no IP com certificado inválido e o navegador
# não guardava o cookie de login (voltava sempre pra tela de login).
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/dash.cmport.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.cmport.com.br/privkey.pem;

    return 301 https://dash.cmport.com.br$request_uri;
}

# HTTPS (443) — certificado emitido/renovado pelo certbot do host
# (deploy/garantir_certificado.sh + certbot.timer)
server {
    listen 443 ssl;
    http2 on;
    server_name dash.cmport.com.br;

    ssl_certificate     /etc/letsencrypt/live/dash.cmport.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.cmport.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamanho máximo de upload (importação de XMLs/ZIPs de notas)
    client_max_body_size 50M;

    # Headers de segurança (aplicados a todas as respostas do domínio).
    # HSTS: força HTTPS por 1 ano — só habilitar depois de confirmar que tudo
    # roda em HTTPS (não há mais acesso legítimo via http://).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;              # anti-clickjacking
    add_header X-Content-Type-Options "nosniff" always;          # anti MIME-sniffing
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy para o Next.js (frontend)
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy direto para o FastAPI (evita duplo proxy Next.js → backend)
    location /api/v1/ {
        proxy_pass         http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Preserva o header Authorization (JWT)
        proxy_set_header   Authorization $http_authorization;
        proxy_pass_header  Authorization;
        # Sync Auvo/Inter pode levar até ~120s — padrão 60s causava 504
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
