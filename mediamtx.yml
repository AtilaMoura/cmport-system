# Config do MediaMTX — recebe RTMP das câmeras e entrega ao vivo via WebRTC.
#
# Autenticação (webhook HTTP no backend, mediamtx_auth_service.py):
# - publish: só aceita se existir câmera ativa com esse rtmp_stream_key
# - read/playback: só o backend (Basic auth com MEDIAMTX_READ_SECRET). Quem
#   assiste passa por POST /api/v1/cameras/{id}/webrtc — o navegador nunca fala
#   direto com a porta 8889 (não exposta em produção) nem vê a chave.
# O endereço do webhook (authHTTPAddress) muda entre dev/produção e é definido
# via variável de ambiente MTX_AUTHHTTPADDRESS no docker-compose correspondente,
# não fixado aqui.
#
# Protocolos não usados nesta fase ficam desligados (superfície mínima exposta).

authMethod: http

rtmpAddress: :1935
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# IP público anunciado como candidato ICE (sem isso vai o IP interno do Docker)
webrtcAdditionalHosts: [168.231.96.184]
apiAddress: :9997
api: yes

rtsp: no
hls: no
srt: no

paths:
  # aceita qualquer path — a autenticação de verdade é o webhook acima
  all_others:
