services:

  # ── Banco de Dados ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: cmport_db
    restart: unless-stopped
    env_file: .env.production
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cmport_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    image: cmport/cmport-api:latest
    container_name: cmport_api
    restart: unless-stopped
    env_file: .env.production
    environment:
      # MediaMTX visto de dentro da cmport_net (MEDIAMTX_READ_SECRET vem do .env.production)
      MEDIAMTX_WEBRTC_INTERNAL_URL: http://mediamtx:8889
      MEDIAMTX_API_INTERNAL_URL: http://mediamtx:9997
    volumes:
      # Certificados do Banco Inter (não commitados no git)
      - ./backend/app/auth:/app/app/auth:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cmport_net

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    image: cmport/cmport-front:latest
    container_name: cmport_front
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - cmport_net

  # ── Nginx (proxy reverso + SSL) ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cmport_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - cmport_net

  # ── Storage (MinIO) ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: cmport_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env.production
    volumes:
      - minio_data:/data
    networks:
      - cmport_net

  # ── MediaMTX (recebe RTMP das câmeras, entrega ao vivo via WebRTC) ───────────
  mediamtx:
    # versão fixa: :latest pode remover opções do mediamtx.yml e quebrar o WebRTC sem aviso
    image: bluenviron/mediamtx:1.21.0
    container_name: cmport_mediamtx
    restart: unless-stopped
    environment:
      MTX_AUTHHTTPADDRESS: http://backend:8000/api/v1/mediamtx/auth
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"     # RTMP push — câmeras apontam pra cá
      - "8189:8189/udp" # WebRTC ICE — o vídeo em si vai direto pro navegador por aqui
      # WebRTC/WHEP (8889) e API (9997) NÃO são expostas pra fora — só o backend
      # acessa pela cmport_net (a URL do WHEP contém a chave de publicação da câmera)
    depends_on:
      - backend
    networks:
      - cmport_net

networks:
  cmport_net:
    driver: bridge

volumes:
  db_data:
  minio_data:
